<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon - Cartuccia NFC</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script type="text/javascript">
    EJS_player = '#game';
    EJS_core = 'gba'; // Specifica la console (GBA)
    EJS_gameName = 'Pokemon'; 
    EJS_color = '#e74c3c';
    EJS_startOnLoaded = true; // Avvia subito il gioco
    
    // Inserisci il percorso relativo o l'URL del tuo file .gba
    EJS_gameUrl = 'Pokemon - Versione Rosso Fuoco (Italy).gba'; 
    
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; // Librerie core da CDN
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
